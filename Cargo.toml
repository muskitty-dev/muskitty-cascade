[package]
name = "muskitty-cascade"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "CSS Cascade Level 5 engine (filtering, cascade, defaulting, computed values)"
repository = "https://github.com/muskitty-dev/muskitty-cascade"
homepage = "https://github.com/muskitty-dev"
documentation = "https://docs.rs/muskitty-cascade"
keywords = ["css", "cascade", "web", "computed-values"]
categories = ["parser-implementations", "web-programming"]
authors = ["MusCat / MusKitty Bit-Torch Community"]

[dependencies]
muskitty-css = { path = "../muskitty-css", version = "0.6.0" }
muskitty-cssom = { path = "../muskitty-cssom", version = "0.1.0" }
# muskitty-dom 目前仅在测试模块使用；compute_style_tree 公共 API（style_tree.rs）上线后
# 将成为正式生产依赖（DOM 树遍历）。保持 [dependencies] 而非降级 dev-deps。
muskitty-dom = { path = "../muskitty-dom", version = "0.2.0" }
muskitty-selectors = { path = "../muskitty-selectors", version = "0.2.0", features = ["dom"] }

[dev-dependencies]
muskitty-html5-parser = { path = "../muskitty-html5-parser", version = "0.2.0" }

# 防止被父 workspace (D:\Muskitty\Cargo.toml) 误吸入。
# cascade 作为独立 git 仓库剥离，有自己的 workspace 根。
[workspace]
